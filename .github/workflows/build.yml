name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Geode CLI
        uses: geode-sdk/install-geode-cli@main

      - name: Build the mod
        run: geode package new --geode 4.0.0-beta.1 || geode build --platform android --config release
        
